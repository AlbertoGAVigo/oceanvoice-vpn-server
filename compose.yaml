services:
  openvpn:
    image: oceanvoice/openvpn-server:0.1.0
    build: .
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: '0'
    ports:
      - "${OPENVPN_PORT:-1194}:1194/udp"
    volumes:
      - openvpn-pki:/var/lib/openvpn

  panel:
    image: oceanvoice/openvpn-panel:0.1.0
    build: ./panel
    restart: unless-stopped
    environment:
      PANEL_USERNAME: "${PANEL_USERNAME:-}"
      PANEL_PASSWORD: "${PANEL_PASSWORD:-}"
    ports:
      - "${PANEL_BIND_IP:-127.0.0.1}:${PANEL_HTTP_PORT:-8085}:8080"

volumes:
  openvpn-pki:
    name: oceanvoice-openvpn-pki
