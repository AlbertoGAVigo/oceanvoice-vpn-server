<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OceanVoice VPN · Panel de control</title>
  <link rel="stylesheet" href="/panel.css">
</head>
<body>
  <header class="top"><div class="wrap identity"><strong>OCEANVOICE</strong><span>VPN / ADMIN</span></div></header>
  <main class="wrap">
    <h1>Panel de control</h1>
    <section aria-labelledby="connection">
      <h2 id="connection">Conexión OpenVPN</h2>
      <dl>
        <div><dt>Servidor</dt><dd>vpn.oceanvoice.es</dd></div>
        <div><dt>Puerto</dt><dd>1194 / UDP</dd></div>
        <div><dt>Entorno</dt><dd>docker-36net</dd></div>
      </dl>
    </section>
    <section aria-labelledby="certificates">
      <h2 id="certificates">Certificados</h2>
      <p>La gestión de certificados está pendiente de integración.</p>
    </section>
  </main>
</body>
</html>
