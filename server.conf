port 1194
proto udp
dev tun0
disable-dco
topology subnet
server 10.80.0.0 255.255.255.0 nopool
client-config-dir /var/lib/openvpn/ccd
ccd-exclusive
script-security 2
learn-address "/usr/bin/python3 /usr/local/lib/oceanvoice/vpn_policy.py learn"
status /var/lib/openvpn/status.tsv 10
status-version 3

ca /var/lib/openvpn/pki/ca.crt
cert /var/lib/openvpn/pki/issued/oceanvoice-server.crt
key /var/lib/openvpn/pki/private/oceanvoice-server.key
crl-verify /var/lib/openvpn/pki/crl.pem
tls-crypt /var/lib/openvpn/tls-crypt.key
dh none
tls-version-min 1.2
remote-cert-tls client
allow-compression no

keepalive 10 60
persist-key
persist-tun
user nobody
group nogroup
verb 3
